<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>BIMopen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230f2742%22/%3E%3Cpath%20d%3D%22M16%205%2027%2011%2016%2017%205%2011z%22%20fill%3D%22%236ea4ff%22/%3E%3Cpath%20d%3D%22M5%2015.5%2016%2021.5%2027%2015.5%22%20fill%3D%22none%22%20stroke%3D%22%236ea4ff%22%20stroke-width%3D%222.2%22%20stroke-linejoin%3D%22round%22%20opacity%3D%22.75%22/%3E%3Cpath%20d%3D%22M5%2020.5%2016%2026.5%2027%2020.5%22%20fill%3D%22none%22%20stroke%3D%22%23ea8a70%22%20stroke-width%3D%222.2%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="modulepreload" href="./bimopen-web-5c0dcf16b6c0b520.js">
  <link rel="preload" href="./bimopen-web-5c0dcf16b6c0b520_bg.wasm" as="fetch" type="application/wasm" crossorigin>
  <script type="module">
    import init from './bimopen-web-5c0dcf16b6c0b520.js';
    try {
      await init({ module_or_path: './bimopen-web-5c0dcf16b6c0b520_bg.wasm' });
    } catch (e) {
      // Not loaded: the splash stops its bar and says why.
      const splash = document.getElementById('bimopen_splash');
      if (splash) {
        splash.classList.add('failed');
        splash.querySelector('.step').textContent = String(e);
      }
      throw e;
    }
  </script>
  <style>
    /* Dark, as the app starts, unless the theme saved is light (see the script below). */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e2228; }
    html.light, html.light body { background: #f4f5f7; }
    #bimopen_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* The splash, as the desktop app's (crates/ui-egui/src/splash.rs), until the app starts:
       dark by default, light when the theme saved is light. */
    #bimopen_splash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #1e2228; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; z-index: 1; }
    #bimopen_splash .card { position: relative; width: 480px; height: 300px; box-sizing: border-box; max-width: calc(100vw - 16px);
      background: #20242b; border: 1px solid #404752; color: #e8ebf0; }
    #bimopen_splash .logo { position: absolute; left: 50%; top: 30px; width: 64px; height: 64px; margin-left: -32px; }
    #bimopen_splash .title { position: absolute; left: 0; right: 0; top: 102px; text-align: center; font-size: 34px; direction: ltr; }
    #bimopen_splash .title span { color: #6ea4ff; }
    #bimopen_splash .version { position: absolute; left: 0; right: 0; top: 156px; text-align: center; font-size: 13px; color: #969eaa; }
    #bimopen_splash .step { position: absolute; left: 32px; right: 32px; bottom: 76px; font-size: 13px; }
    #bimopen_splash .bar { position: absolute; left: 32px; right: 32px; bottom: 63px; height: 3px; border-radius: 1.5px;
      background: #3a414c; overflow: hidden; }
    #bimopen_splash .bar div { width: 30%; height: 100%; border-radius: 1.5px; background: #6ea4ff;
      animation: bimopen_load 1.4s ease-in-out infinite; }
    @keyframes bimopen_load { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    #bimopen_splash .foot { position: absolute; left: 32px; right: 32px; bottom: 22px; display: flex; justify-content: space-between;
      gap: 16px; font-size: 11px; color: #969eaa; }
    #bimopen_splash.light { background: #f4f5f7; }
    #bimopen_splash.light .card { background: #fff; border-color: #d0d4da; color: #1c2026; }
    #bimopen_splash.light .title span { color: #1c70c4; }
    #bimopen_splash.light .bar { background: #e2e5ea; }
    #bimopen_splash.light .bar div { background: #1c70c4; }
    #bimopen_splash.light .version, #bimopen_splash.light .foot { color: #6e747e; }
    /* The app did not start: no progress any more, the reason in place of the step. */
    #bimopen_splash .fail { display: none; position: absolute; left: 32px; right: 32px; top: 184px; font-size: 13px; font-weight: 600; }
    #bimopen_splash.failed .fail { display: block; }
    #bimopen_splash.failed .bar { display: none; }
    #bimopen_splash.failed .step { bottom: 50px; top: 204px; overflow: auto; font-size: 11px; color: #ff8a80; white-space: pre-wrap; }
    #bimopen_splash.failed.light .step { color: #c62828; }
  </style>
</head>
<body>
  <canvas id="bimopen_canvas"></canvas>
  <div id="bimopen_splash" data-version="0.1.0">
    <div class="card">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0f2742"/><path d="M16 5 27 11 16 17 5 11z" fill="#6ea4ff"/><path d="M5 15.5 16 21.5 27 15.5" fill="none" stroke="#6ea4ff" stroke-width="2.2" stroke-linejoin="round" opacity=".75"/><path d="M5 20.5 16 26.5 27 20.5" fill="none" stroke="#ea8a70" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <div class="title">BIM<span>open</span></div>
      <div class="version" data-text="{version} pre-alpha · versione di prova"></div>
      <div class="step" data-text="Caricamento in corso"></div>
      <div class="bar"><div></div></div>
      <div class="fail" data-text="BIMopen non si è avviato"></div>
      <div class="foot"><span data-text="Versione parziale, solo per prova"></span><span data-text="Sarà open source (MIT/Apache)"></span></div>
    </div>
  </div>
  <!-- The splash's texts in every language: the catalogs' (a test of bimopen-ui-egui checks them). -->
  <script id="bimopen_splash_texts" type="application/json">{"it":{"Caricamento in corso":"Caricamento in corso","{version} pre-alpha · versione di prova":"{version} pre-alpha · versione di prova","Versione parziale, solo per prova":"Versione parziale, solo per prova","Sarà open source (MIT/Apache)":"Sarà open source (MIT/Apache)","BIMopen non si è avviato":"BIMopen non si è avviato"},
    "en":{"Caricamento in corso":"Loading","{version} pre-alpha · versione di prova":"{version} pre-alpha · trial version","Versione parziale, solo per prova":"Partial version, for testing only","Sarà open source (MIT/Apache)":"Will be open source (MIT/Apache)","BIMopen non si è avviato":"BIMopen did not start"},
    "de":{"Caricamento in corso":"Wird geladen","{version} pre-alpha · versione di prova":"{version} Pre-Alpha · Testversion","Versione parziale, solo per prova":"Teilversion, nur zum Testen","Sarà open source (MIT/Apache)":"Wird Open Source (MIT/Apache)","BIMopen non si è avviato":"BIMopen konnte nicht starten"},
    "fr":{"Caricamento in corso":"Chargement en cours","{version} pre-alpha · versione di prova":"{version} pré-alpha · version d'essai","Versione parziale, solo per prova":"Version partielle, pour essai uniquement","Sarà open source (MIT/Apache)":"Sera open source (MIT/Apache)","BIMopen non si è avviato":"BIMopen n'a pas démarré"},
    "es":{"Caricamento in corso":"Cargando","{version} pre-alpha · versione di prova":"{version} prealfa · versión de prueba","Versione parziale, solo per prova":"Versión parcial, solo para pruebas","Sarà open source (MIT/Apache)":"Será de código abierto (MIT/Apache)","BIMopen non si è avviato":"BIMopen no se ha iniciado"},
    "ar":{"Caricamento in corso":"جارٍ التحميل","{version} pre-alpha · versione di prova":"{version} ما قبل ألفا · نسخة تجريبية","Versione parziale, solo per prova":"نسخة جزئية، للتجربة فقط","Sarà open source (MIT/Apache)":"ستصبح مفتوحة المصدر (MIT/Apache)","BIMopen non si è avviato":"لم يبدأ BIMopen"}}</script>
  <script>
    // The splash follows the language and theme the app saved (?lang=xx first, as the app),
    // otherwise the browser's language when it is one of the six, otherwise English.
    (function () {
      var splash = document.getElementById("bimopen_splash");
      var texts = JSON.parse(document.getElementById("bimopen_splash_texts").textContent);
      var stored = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var known = function (code) { code = (code || "").slice(0, 2).toLowerCase(); return texts[code] ? code : null; };
      var lang = known(new URLSearchParams(location.search).get("lang")) || known(stored("bimopen.lang"));
      for (var i = 0; !lang && i < (navigator.languages || []).length; i++) lang = known(navigator.languages[i]);
      lang = lang || "en";
      document.documentElement.lang = lang;
      splash.dir = lang === "ar" ? "rtl" : "ltr";
      // Dark unless the theme saved is light, as the app.
      var dark = stored("bimopen.dark") !== "0";
      if (!dark) { splash.classList.add("light"); document.documentElement.classList.add("light"); }
      splash.querySelectorAll("[data-text]").forEach(function (el) {
        el.textContent = texts[lang][el.dataset.text].replace("{version}", splash.dataset.version);
      });
    })();
  </script>
</body>
</html>
